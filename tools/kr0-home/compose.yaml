# kr0-home: the studio's local services, run with the kr0-home CLI.
# Settings come from .env next to this file (copy .env.example).
name: kr0-home

services:
  asset-desk:
    build: ../asset-desk
    image: kr0-home/asset-desk:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KR0_ASSET_DESK_PORT:-8765}:8765"
    volumes:
      - type: bind
        source: "${KR0_DRIVE_ART:?Set KR0_DRIVE_ART in tools/kr0-home/.env}"
        target: /art/drive
      - type: bind
        source: ../../art
        target: /art/repo
    environment:
      SCENARIO_API_KEY: "${SCENARIO_API_KEY:-}"
      SCENARIO_API_SECRET: "${SCENARIO_API_SECRET:-}"
    command:
      - "--show-as"
      - "drive=${KR0_DRIVE_ART}"
      - "--who"
      - "${KR0_WHO:-kr0}"
